services:
  nats:
    image: nats:2.10-alpine
    container_name: nats-core
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-c", "/etc/nats/nats.conf"]
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - spatial_net
    restart: always
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro

  go-worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile
    container_name: go-worker
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222
    networks:
      - spatial_net
    restart: always

  node-plane:
    build:
      context: ./node-plane
      dockerfile: Dockerfile
    container_name: node-plane
    depends_on:
      - nats
      - go-worker
    environment:
      - NATS_URL=nats://nats:4222
      - NODE_ENV=production
    networks:
      - spatial_net
    restart: always

networks:
  spatial_net:
    driver: bridge
