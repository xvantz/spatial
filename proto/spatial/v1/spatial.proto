syntax = "proto3";

package spatial.v1;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PlayerDelta {
  uint32 user_id = 1;
  Vector3 position = 2;
}

message TelemetryBatch {
  repeated PlayerDelta players = 1;
}

message VisibilityQuery {
  uint32 user_id = 1;
  float radius = 2;
}

message VisibilityBatchQuery {
  repeated VisibilityQuery queries = 1;
}

message VisibilityResult {
  uint32 user_id = 1;
  repeated uint32 visible_user_ids = 2;
}

message VisibilityBatchResponse {
  repeated VisibilityResult results = 1;
}

message ColshapeEvent {
  uint32 user_id = 1;
  string colshape_id = 2;
  bool is_enter = 3;
}
