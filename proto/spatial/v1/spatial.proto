syntax = "proto3";

package spatial.v1;

message PlayerDelta {
  uint32 user_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message TelemetryBatch {
  repeated PlayerDelta players = 1;
}

message VisibilityRequest {
  repeated uint32 visible_user_ids = 1;
}

message ColshapeEvent {
  uint32 user_id = 1;
  string colshape_id = 2;
  bool is_enter = 3;
}
