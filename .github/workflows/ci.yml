name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-worker:
    name: Go Worker (Coprocessor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-worker
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"

      - uses: bufbuild/buf-setup-action@v1

      - name: Generate Protobuf code
        run: |
          cd ..
          buf generate

      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go-worker
          args: ./cmd/... ./internal/...

      - name: Run Tests
        run: go test -v ./...

  node-plane:
    name: Node Plane (Master)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-plane
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: bufbuild/buf-setup-action@v1

      - name: Generate Protobuf code
        run: |
          cd ..
          buf generate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bunx tsc --noEmit
