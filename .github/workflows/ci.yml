name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-worker:
    name: Go Worker (Coprocessor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go-worker/go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf code
        run: buf generate

      - name: Update go modules
        working-directory: go-worker
        run: go mod tidy

      - name: Build project
        working-directory: go-worker
        run: go build ./...

      - name: Format Check
        working-directory: go-worker
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go-worker
          args: ./cmd/... ./internal/...

      - name: Run Tests (with race detector)
        working-directory: go-worker
        run: go test -v -race -count=1 ./...

  node-plane:
    name: Node Plane (Master)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf code
        run: buf generate

      - name: Install dependencies
        working-directory: node-plane
        run: bun install --frozen-lockfile

      - name: Type Check
        working-directory: node-plane
        run: bunx tsc --noEmit

      - name: Run Tests
        working-directory: node-plane
        run: bun test
